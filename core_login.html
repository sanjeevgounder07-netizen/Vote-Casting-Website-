<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Core Council — Teacher Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --brand:#bf0a30;
      --dark:#002868;
      --bg:#f4f6f8;
      --muted:#666;
    }
    html,body{
      height:100%;
      margin:0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color:#111;
    }
    .page{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }
    .card{
      width:100%;
      max-width:550px;
      background: rgba(255,255,255,0.92);
      border-radius:12px;
      box-shadow:0 6px 18px rgba(15,23,42,0.08);
      padding:36px;
      box-sizing:border-box;
      text-align:center;
    }
    .card img{height:90px;margin-bottom:14px;}
    .college-name{
      font-size:20px;
      font-weight:bold;
      color:var(--dark);
      margin-bottom:8px;
      line-height:1.4;
    }
    .card h1{
      font-size:18px;
      margin-bottom:20px;
      color:var(--brand);
      line-height:1.4;
    }
    label{
      display:block;
      margin-top:14px;
      font-weight:600;
      color:var(--muted);
      font-size:16px;
      text-align:left;
    }
    input, button{
      width:100%;
      padding:12px 14px;
      margin-top:6px;
      border-radius:8px;
      border:1px solid #d0d7dd;
      font-size:16px;
      box-sizing:border-box;
    }
    button.primary{
      background:var(--brand);
      color:#fff;
      border:none;
      font-size:18px;
      padding:14px 16px;
      margin-top:20px;
      cursor:pointer;
      font-weight:bold;
      border-radius:8px;
      box-shadow:0 6px 12px rgba(191,10,48,0.12);
    }
    button.primary:hover{
      transform:translateY(-2px);
    }
  </style>
</head>
<body>

<main class="page">
  <div class="card">
    <img src="sms.jpg" alt="School Logo">
    <div class="college-name">
      BUNTS SANGHA'S<br>
      S M SHETTY HIGH SCHOOL AND JUNIOR COLLEGE
    </div>
    <h1>Core Student Council Election — Teacher Login</h1>

    <form onsubmit="coreLogin(event)">
      <label for="coreTeacher">Name of the Teacher Conducting the Election:</label>
      <input type="text" id="coreTeacher" required>

      <label for="corePassword">Password:</label>
      <input type="password" id="corePassword" required>

      <button class="primary" type="submit">Proceed to Setup</button>
    </form>
  </div>
</main>

<script>
function coreLogin(ev){
  ev.preventDefault();
  const teacher = document.getElementById('coreTeacher').value.trim();
  const password = document.getElementById('corePassword').value;

  // Store separately for core elections
  localStorage.setItem('core_teacherName', teacher);
  localStorage.setItem('core_teacherPassword', password);

  window.location.href = 'core_setup.html';
}
</script>

</body>
</html>
